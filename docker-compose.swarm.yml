services:
  ca:
    image: smart_meter-ca
    environment:
      - ROLE=ca
      - HOST=0.0.0.0
      - PORT=5005
      - TZ=Europe/London
    ports:
      - "5005:5005"
    volumes:
      - ca_db:/app/data
    networks:
      - lightmeter
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager        # laptop

  utility:
    image: smart_meter-utility
    environment:
      - ROLE=utility
      - CA_HOST=ca
      - CA_PORT=5005
      - UTILITY_PASS=12345
      - TZ=Europe/London
    networks:
      - lightmeter
    deploy:
      replicas: 4
      placement:
        constraints:
          - node.role == manager        # laptop
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  base_meter:
    image: smart_meter-base_meter
    environment:
      - ROLE=base_meter
      - CA_HOST=ca
      - CA_PORT=5005
      - BASE_METER_PASS=12345
      - TZ=Europe/London
    networks:
      - lightmeter
    deploy:
      replicas: 15
      placement:
        constraints:
          - node.role == manager        # laptop
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  pi_meter:
    image: smart_meter-base_meter       # same image, pinned to Pi
    entrypoint: bash -c 'until getent hosts ca > /dev/null 2>&1; do echo waiting for ca DNS...; sleep 3; done && bash /app/entrypoint.sh'
    environment:
      - ROLE=base_meter
      - CA_HOST=ca
      - CA_PORT=5005
      - BASE_METER_PASS=12345
      - TZ=Europe/London
      - INITIATE=true
    networks:
      - lightmeter
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == pi      # Pi — the device under test
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 10s                      # Pi gets a longer delay — it needs quorum nodes up too
        max_attempts: 10

networks:
  lightmeter:
    driver: overlay
    attachable: true

volumes:
  ca_db:
